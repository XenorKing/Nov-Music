name: Get SHA-1 Hash

on:
  workflow_dispatch:

jobs:
  get-sha1:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=novmusic,OU=novmusic,O=novmusic,L=RU,S=RU,C=RU"

      - name: Print SHA-1 hash
        run: |
          echo "========================================"
          echo "   SHA-1 ХЕШ ДЛЯ VK И FIREBASE"
          echo "========================================"
          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep "SHA1:"
          echo "========================================"

      - name: Save keystore as base64 (для GitHub Secret KEYSTORE_BASE64)
        run: |
          echo ""
          echo "=== KEYSTORE_BASE64 для GitHub Secrets ==="
          base64 debug.keystore
          echo "==========================================="
