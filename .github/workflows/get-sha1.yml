name: Get SHA-1 Hash

on:
  workflow_dispatch:

jobs:
  get-sha1:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias NovMusic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore nov_music.keystore \
            -storepass novaproject2026 \
            -keypass novaproject2026 \
            -dname "CN=novmusic,OU=novmusic,O=novmusic,L=RU,S=RU,C=RU"

      - name: Print SHA-1 hash
        run: |
          echo "========================================"
          echo "   SHA-1 ХЕШ ДЛЯ VK И FIREBASE"
          echo "========================================"
          keytool -list -v \
            -keystore nov_music.keystore \
            -alias NovMusic \
            -storepass novaproject2026 \
            -keypass novaproject2026 \
            | grep -E "SHA1:|SHA256:"
          echo "========================================"

      - name: KEYSTORE_BASE64
        run: |
          echo ""
          echo "=== KEYSTORE_BASE64 ==="
          base64 -w 0 nov_music.keystore
          echo ""
          echo "======================="
