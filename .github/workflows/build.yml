name: Build APK

  on:
    push:
      branches: [ main, master ]
    pull_request:
      branches: [ main, master ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: gradle

        - name: Setup Android SDK
          uses: android-actions/setup-android@v3

        - name: Grant execute permission to gradlew
          run: chmod +x gradlew

        - name: Create google-services.json
          run: |
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

        - name: Decode Keystore
          run: |
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

        - name: Build Debug APK
          run: |
            ./gradlew assembleDebug --no-daemon \
              -PVK_APP_ID="${{ secrets.VK_APP_ID }}"

        - name: Upload Debug APK
          uses: actions/upload-artifact@v4
          with:
            name: nov-music-debug-${{ github.run_number }}
            path: app/build/outputs/apk/debug/app-debug.apk
            retention-days: 30

    release:
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      needs: build

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: gradle

        - name: Setup Android SDK
          uses: android-actions/setup-android@v3

        - name: Grant execute permission
          run: chmod +x gradlew

        - name: Create google-services.json
          run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

        - name: Decode Keystore
          run: |
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

        - name: Build Release APK
          run: |
            ./gradlew assembleRelease --no-daemon \
              -PKEYSTORE_PATH=keystore.jks \
              -PKEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASS="${{ secrets.KEY_PASS }}" \
              -PVK_APP_ID="${{ secrets.VK_APP_ID }}"

        - name: Upload Release APK
          uses: actions/upload-artifact@v4
          with:
            name: nov-music-release-${{ github.run_number }}
            path: app/build/outputs/apk/release/app-release.apk
            retention-days: 90
  